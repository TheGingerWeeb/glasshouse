<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Glasshouse — audit your own footprint{% endblock %}</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2330;
      --text: #e6edf3;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #58a6ff;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.site {
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    header.site .brand { font-weight: 700; letter-spacing: .3px; color: var(--text); }
    header.site .spacer { flex: 1; }
    header.site nav a { color: var(--muted); font-size: 14px; }
    main { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
    h2 { font-size: 21px; margin: 36px 0 12px; }
    h3 { font-size: 16px; margin: 22px 0 8px; }
    p.lede { color: var(--muted); margin-top: 0; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
    }
    .panel + .panel { margin-top: 14px; }
    label.field { display: block; margin-bottom: 16px; }
    label.field span.name { display: block; font-weight: 600; margin-bottom: 4px; }
    label.field span.hint { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    input[type=text], input[type=email], textarea {
      width: 100%;
      background: #0b0f14;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    textarea { min-height: 76px; resize: vertical; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row > * { flex: 1 1 220px; }
    .checks { display: flex; gap: 16px; flex-wrap: wrap; }
    .checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
    button, .btn {
      display: inline-block;
      background: var(--accent);
      color: #04121f;
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover, .btn:hover { filter: brightness(1.08); text-decoration: none; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      font-weight: 500;
      padding: 8px 13px;
    }
    .consent { display: flex; gap: 10px; align-items: flex-start; margin: 18px 0; font-size: 14px; color: var(--muted); }
    .consent input { margin-top: 3px; }
    .notice {
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      background: var(--panel-2);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--muted);
      margin: 16px 0;
    }
    .notice.bad { border-left-color: var(--bad); }
    .notice.warn { border-left-color: var(--warn); }
    .notice.good { border-left-color: var(--good); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; border-top: 3px solid var(--line); }
    .card.good { border-top-color: var(--good); }
    .card.warn { border-top-color: var(--warn); }
    .card.bad { border-top-color: var(--bad); }
    .card.muted { border-top-color: var(--muted); }
    .card .label { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .card h3 { margin: 4px 0 8px; font-size: 17px; }
    .card .why { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
    .card .fix { font-size: 14px; margin: 0; }
    ul.plain { list-style: none; padding: 0; margin: 0; }
    .account { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .account:last-child { border-bottom: 0; }
    .account .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
    .check-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .check-row:last-child { border-bottom: 0; }
    .check-row input[type=checkbox] { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--good); }
    .check-row .body { flex: 1; font-size: 15px; }
    .check-row .body small { color: var(--muted); display: block; }
    .check-row.done .body strong { color: var(--muted); text-decoration: line-through; }
    .bar { height: 10px; background: #0b0f14; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
    .bar > span { display: block; height: 100%; background: var(--good); }
    .progress-wrap { max-width: 620px; margin: 60px auto; text-align: center; }
    .progress-wrap .bar { height: 14px; }
    table.links { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.links th, table.links td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.links th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; background: var(--panel-2); }
    summary { cursor: pointer; font-weight: 600; }
    pre.letter { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); }
    code { background: #0b0f14; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
    footer.site { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .small { font-size: 13px; color: var(--muted); }
    .badge.good { color: var(--good); border-color: var(--good); }
    .badge.warn { color: var(--warn); border-color: var(--warn); }
    .btn.wide { display: block; text-align: center; padding: 14px 18px; margin: 12px 0; font-size: 17px; }
    .queue-head { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 8px; }
    .toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
    .broker-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 18px;
      margin: 14px 0;
    }
    .broker-card[hidden] { display: none; }
    .broker-card .broker-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
    .broker-card .broker-top strong { font-size: 18px; margin-right: 4px; }
    ol.steps { margin: 12px 0; padding-left: 22px; color: var(--text); font-size: 15px; }
    ol.steps li { margin: 4px 0; }
    .copy-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .sticky-copy {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      background: #11161d;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
      z-index: 20;
    }
    .sticky-copy button { padding: 5px 11px; }
    @media (max-width: 620px) {
      h1 { font-size: 24px; }
      main { padding: 20px 14px 120px; }
      .sticky-copy { left: 10px; right: 10px; transform: none; justify-content: center; }
    }
    @media print {
      body { background: #fff; color: #111; }
      header.site, footer.site, .no-print, button { display: none !important; }
      .panel, .card, .broker-card { border-color: #ccc; background: #fff; }
      a { color: #0645ad; }
      .bar { border-color: #999; }
    }
  </style>
</head>
<body>
  <header class="site">
    <span class="brand">🪟 Glasshouse</span>
    <span class="spacer"></span>
    <nav>
      <a href="/">New scan</a> &nbsp;·&nbsp; <a href="/privacy">Privacy</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    Glasshouse checks public information only. It stores nothing after your session.
    Not found does not mean safe. Mentions are not proof.
  </footer>
  <script>
    function copyText(id) {
      const el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(el.textContent).then(() => {
        const btn = document.getElementById(id + '-btn');
        if (btn) { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1500); }
      });
    }
  </script>
  <script src="/static/app.js" defer></script>
</body>
</html>
